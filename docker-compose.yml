services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: blindem
      POSTGRES_PASSWORD: blindem_local
      POSTGRES_DB: blindem
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blindem"]
      interval: 5s
      retries: 10
    volumes:
      - blindem_pg:/var/lib/postgresql/data
  app:
    build:
      context: .
      args:
        INSTALL_DEV: "true"
    ports: ["127.0.0.1:8000:8000"]
    environment:
      APP_NAME: Blindem
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: "${APP_KEY}"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: blindem
      DB_USERNAME: blindem
      DB_PASSWORD: blindem_local
      SESSION_DRIVER: database
      CACHE_STORE: file
      LOG_CHANNEL: stderr
      RUN_MIGRATIONS: "true"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:'.getenv('PORT').'/up')===false?1:0);"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  blindem_pg:
